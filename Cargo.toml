[package]
name = "coap-server"
version = "0.1.2"
description = "Robust async CoAP server"
authors = ["Josh Guilfoyle <jasta@devtcg.org>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jasta/coap-server-rs"
categories = ["network-programming"]
keywords = ["coap", "server", "async", "IoT"]
edition = "2021"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "net"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec", "net"] }
bytes = "1.12.1"
futures = "0.3.34"
async-trait = "0.1.92"
pin-project = "1.1.13"
dyn-clone = "1.0.20"
anyhow = "1.0.104"
thiserror = "2.0.21"
log = "0.4.34"
coap-lite = "0.13.3"
rand = "0.10.3"

[dev-dependencies]
async-stream = "0.3.6"
tokio = { version = "1.53.1", features = ["test-util", "rt-multi-thread"] }
env_logger = "0.11.11"
